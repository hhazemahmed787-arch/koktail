<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2B705">
<title>كوكتيل | KOKTAIL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#FAF4E6; --card:#FFFFFF; --ink:#2B2620; --sub:#8A7C63; --line:#EADFC6; --line2:#D9CBA8;
  --yell:#F2B705; --yell-d:#C79100; --org:#F07F3C; --grn:#3E9B4F; --grn-d:#2E7A3C; --red:#DF5350; --red-d:#B93E3C;
  --teal:#2FA98C; --teal-d:#227E68; --plum:#C4547F; --sky:#4B6BAF; --navy:#1B2333;
  --r:18px; --shadow:0 2px 0 rgba(43,38,32,.09);
}
html[data-theme="dark"]{
  --bg:#211D16; --card:#2C2720; --ink:#F4ECDC; --sub:#A99B80; --line:#3B342A; --line2:#4A4132;
  --shadow:0 2px 0 rgba(0,0,0,.35);
}
body{font-family:'Baloo Bhaijaan 2','Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit;color:inherit}
bdi,.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:9px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:17px;border-radius:14px;padding:12px 22px;transition:transform .08s,box-shadow .08s;border:2px solid transparent}
.btn:active{transform:translateY(2px)}
.btn-y{background:var(--yell);color:#2B2620;box-shadow:0 3px 0 var(--yell-d)}
.btn-y:active{box-shadow:0 1px 0 var(--yell-d)}
.btn-g{background:var(--grn);color:#fff;box-shadow:0 3px 0 var(--grn-d)}
.btn-r{background:var(--red);color:#fff;box-shadow:0 3px 0 var(--red-d)}
.btn-t{background:var(--teal);color:#fff;box-shadow:0 3px 0 var(--teal-d)}
.btn-o{background:var(--card);border-color:var(--line2);box-shadow:var(--shadow)}
.btn-dis{opacity:.45;pointer-events:none}
.btn-sm{font-size:14px;padding:7px 14px;border-radius:11px}
.chip{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:14px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:4px 12px}
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.inp{width:100%;background:var(--bg);border:2px solid var(--line2);border-radius:14px;padding:12px 16px;font-size:17px;font-weight:600;outline:none;transition:border .15s}
.inp:focus{border-color:var(--yell)}
h1,h2,h3{font-weight:800}
.muted{color:var(--sub)}
.logo{display:flex;align-items:center;gap:10px}
.logo .t{line-height:1.05;text-align:start}
.logo .t b{display:block;font-size:1.3em;font-weight:800}
.logo .t span{font-size:.68em;letter-spacing:3px;color:var(--sub);font-weight:700}
.scr{display:none;min-height:100vh}
.scr.on{display:block}
.center{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
#welcome-box{width:100%;max-width:420px}
.field{margin-bottom:14px;text-align:right}
.field label{display:block;font-weight:700;font-size:14px;margin-bottom:5px}
.err{color:var(--red);font-weight:700;font-size:14px;min-height:20px;margin-top:4px}
#scr-onboard .wrap{max-width:760px;margin:0 auto;padding:18px 16px 90px}
.step-dots{display:flex;gap:7px;justify-content:center;margin:14px 0 6px}
.step-dots i{width:10px;height:10px;border-radius:50%;background:var(--line2)}
.step-dots i.on{background:var(--yell);transform:scale(1.2)}
.ob-title{text-align:center;font-size:28px;margin:8px 0 4px}
.ob-sub{text-align:center;color:var(--sub);font-weight:600;margin-bottom:20px}
.ob-foot{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:2px solid var(--line);padding:12px 16px;display:flex;gap:10px;justify-content:center;z-index:20}
.lang-row{display:flex;align-items:center;gap:14px;width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:16px;background:var(--card);margin-bottom:10px;font-weight:800;font-size:17px;text-align:right;transition:border .15s,transform .1s}
.lang-row:hover{transform:translateX(-3px)}
.lang-row .glyph{width:46px;height:46px;border-radius:13px;background:var(--yell);color:#2B2620;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;flex-shrink:0}
.lang-row small{display:block;font-weight:600;color:var(--sub);font-size:13px}
.big-opt{display:block;width:100%;max-width:340px;margin:0 auto 12px;padding:20px;border:2px solid var(--line);border-radius:18px;background:var(--card);font-weight:800;font-size:19px;box-shadow:var(--shadow);transition:transform .1s}
.big-opt:active{transform:translateY(2px)}
.big-opt small{display:block;font-weight:600;color:var(--sub);font-size:14px;margin-top:3px}
.av-grid{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;justify-content:center}
.av-prev{position:sticky;top:10px}
.av-cats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;justify-content:center}
.av-cats button{padding:7px 13px;border-radius:999px;font-weight:700;font-size:13px;border:2px solid var(--line);background:var(--card);color:var(--sub)}
.av-cats button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.av-opts{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;min-height:64px}
.av-opt{width:58px;height:58px;border-radius:14px;border:2px solid var(--line);background:var(--bg);display:flex;align-items:center;justify-content:center;padding:4px;transition:transform .1s}
.av-opt.on{border-color:var(--yell);background:var(--card);box-shadow:0 0 0 3px var(--yell)}
.av-opt:active{transform:scale(.92)}
.bird-cards{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.bird-card{width:150px;padding:12px;border:2px solid var(--line);border-radius:18px;background:var(--card);text-align:center;box-shadow:var(--shadow);transition:transform .12s,border .12s}
.bird-card.on{border-color:var(--yell);box-shadow:0 0 0 3px var(--yell)}
.bird-card b{display:block;font-size:15px}
.bird-card small{color:var(--sub);font-weight:600;font-size:12px}
.bird-card:active{transform:scale(.95)}
#topbar{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:2px solid var(--line);padding:8px 14px;display:flex;align-items:center;gap:10px}
#topbar .hud{display:flex;gap:7px;margin-inline-start:auto;align-items:center}
.chip .n{font-weight:800}
#app-body{display:flex;max-width:1080px;margin:0 auto;width:100%}
#main{flex:1;padding:16px 14px 90px;min-height:calc(100vh - 60px)}
#nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:2px solid var(--line);display:flex;justify-content:space-around;padding:6px 2px calc(6px + env(safe-area-inset-bottom))}
#nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:700;color:var(--sub);padding:5px 6px;border-radius:12px}
#nav button.on{color:var(--ink);background:var(--line)}
#nav button svg{width:21px;height:21px}
@media(min-width:900px){
  #nav{position:sticky;top:60px;height:calc(100vh - 60px);width:190px;flex-direction:column;justify-content:flex-start;gap:6px;padding:16px 10px;border-top:none;border-inline-start:2px solid var(--line)}
  #nav button{flex-direction:row;justify-content:flex-start;font-size:15px;padding:11px 14px;width:100%}
  #nav button svg{width:21px;height:21px}
  #main{padding:22px 26px}
}
.hero{display:flex;gap:16px;align-items:stretch;flex-wrap:wrap;margin-bottom:16px}
.hero-txt{flex:1 1 300px;display:flex;flex-direction:column;gap:10px}
.hero-txt h2{font-size:26px}
.goal-ring{display:flex;align-items:center;gap:12px}
.goal-ring .txt small{display:block;color:var(--sub);font-weight:700;font-size:13px}
.hero-av{flex:0 0 auto}
.av-scene{width:230px;height:230px;border-radius:24px;border:2px solid var(--line);overflow:hidden;position:relative;box-shadow:var(--shadow);background:var(--card)}
.av-scene .bwrap{position:absolute;bottom:2px;left:6px;width:74px;cursor:pointer}
.av-scene .floor{position:absolute;bottom:0;left:0;right:0;height:26px;background:var(--line);opacity:.5}
.sec-title{font-size:18px;margin:20px 0 10px;display:flex;align-items:center;gap:8px}
.ch-row{display:flex;align-items:center;gap:12px;padding:11px 14px;border:2px solid var(--line);border-radius:14px;background:var(--card);margin-bottom:8px}
.ch-row .bar{flex:1;height:9px;background:var(--line);border-radius:9px;overflow:hidden}
.ch-row .bar i{display:block;height:100%;background:var(--grn);border-radius:9px;transition:width .5s}
.ch-row.done{border-color:var(--grn)}
.ch-row.done .lbl{text-decoration:line-through;color:var(--sub)}
.tutor-banner{width:100%;display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:20px;background:var(--teal);color:#fff;box-shadow:0 3px 0 var(--teal-d);text-align:right;margin-top:6px}
.tutor-banner b{font-size:18px;display:block}
.tutor-banner small{opacity:.9;font-weight:600}
.unit-head{display:flex;align-items:center;gap:12px;margin:26px 0 6px}
.unit-head .uic{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.unit-head .uic svg{width:24px;height:24px}
.unit-head small{display:block;color:var(--sub);font-weight:700}
.unit-head .ubar{flex:1;height:10px;background:var(--line);border-radius:9px;overflow:hidden;max-width:130px}
.unit-head .ubar i{display:block;height:100%;border-radius:9px}
.path{position:relative;padding:6px 0 10px}
.path::before{content:"";position:absolute;top:0;bottom:0;right:50%;border-inline-start:3px dashed var(--line2)}
.node-row{position:relative;display:flex;margin:6px 0;z-index:1}
.node{display:flex;align-items:center;gap:10px;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px 8px 10px;font-weight:800;font-size:15px;box-shadow:var(--shadow);width:200px;text-align:right}
.node .dot{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff}
.node-row.side-r{justify-content:flex-start;padding-right:8%}
.node-row.side-l{justify-content:flex-end;padding-left:8%;flex-direction:row-reverse}
.node.done .dot{background:var(--grn)}
.node.open .dot{background:var(--yell);color:#2B2620;animation:pulse 1.6s infinite}
.node.lock{opacity:.55;cursor:not-allowed}
.node.lock .dot{background:var(--line2)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(242,183,5,.5)}50%{box-shadow:0 0 0 9px rgba(242,183,5,0)}}
#les-top{display:flex;align-items:center;gap:12px;padding:10px 0}
.pbar{flex:1;height:13px;background:var(--line);border-radius:9px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--grn);border-radius:9px;transition:width .35s}
#les-body{max-width:640px;margin:0 auto}
.les-hint{text-align:center;color:var(--sub);font-weight:700;font-size:13px;margin:0 0 8px}
.q-title{font-size:22px;font-weight:800;margin:12px 0 16px;text-align:center}
.opt{display:flex;align-items:center;gap:10px;width:100%;padding:13px 16px;margin-bottom:9px;border:2px solid var(--line2);border-radius:15px;background:var(--card);font-weight:700;font-size:17px;text-align:right;transition:transform .08s}
.opt:active{transform:scale(.98)}
.opt.ok{border-color:var(--grn);background:rgba(62,155,79,.12)}
.opt.no{border-color:var(--red);background:rgba(223,83,80,.1);animation:shake .3s}
@keyframes shake{25%{transform:translateX(5px)}75%{transform:translateX(-5px)}}
.tts-big{display:flex;justify-content:center;margin:14px 0}
.tts-btn{width:78px;height:78px;border-radius:50%;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 var(--teal-d)}
.tts-btn svg{width:36px;height:36px}
.tts-btn:active{transform:translateY(2px)}
.write-box{display:flex;gap:8px;margin-top:10px}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px;padding-top:14px;border-top:2px dashed var(--line)}
.token{padding:9px 14px;border:2px solid var(--line2);border-radius:12px;background:var(--card);font-weight:800;font-size:16px;box-shadow:var(--shadow)}
.token:active{transform:scale(.94)}
.slot{min-height:52px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;padding:8px;border:2px dashed var(--line2);border-radius:14px;background:var(--bg);margin-bottom:8px}
.slot .token{border-style:solid;border-color:var(--yell-d)}
.match-cols{display:flex;gap:12px;justify-content:center}
.match-col{flex:1;display:flex;flex-direction:column;gap:9px}
.match-it{padding:12px 10px;border:2px solid var(--line2);border-radius:13px;background:var(--card);font-weight:800;text-align:center;transition:border .15s}
.match-it.ok{border-color:var(--grn);opacity:.5;pointer-events:none}
.match-it.sel{border-color:var(--yell);box-shadow:0 0 0 3px var(--yell)}
.match-it.no{border-color:var(--red);animation:shake .3s}
.para-card{padding:16px 18px;font-size:18px;line-height:2;margin-bottom:14px;font-weight:600}
.mic-wrap{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.mic-btn{padding:11px 20px;border-radius:14px;background:var(--plum);color:#fff;font-weight:800;box-shadow:0 3px 0 #93395c}
.mic-btn.rec{background:var(--red);animation:pulse 1.2s infinite}
#fb{position:fixed;bottom:0;left:0;right:0;z-index:40;padding:14px 18px calc(14px + env(safe-area-inset-bottom));display:none;align-items:center;gap:12px;border-top:2px solid transparent;animation:slideUp .25s}
#fb.on{display:flex}
#fb.good{background:var(--grn);color:#fff;border-color:var(--grn-d)}
#fb.bad{background:var(--red);color:#fff;border-color:var(--red-d)}
#fb .fb-txt{flex:1;min-width:0}
#fb .fb-txt b{font-size:18px;display:block}
#fb .fb-txt small{font-weight:600;opacity:.92}
#fb .btn{flex-shrink:0}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.res-stars{display:flex;gap:10px;justify-content:center;margin:14px 0}
.res-stars svg{width:52px;height:52px;color:var(--line2)}
.res-stars svg.lit{color:var(--yell);animation:pop .5s backwards}
.res-stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:16px 0}
.res-stat{padding:12px 18px;border:2px solid var(--line);border-radius:15px;background:var(--card);text-align:center;min-width:100px}
.res-stat b{font-size:22px;display:block}
.res-stat small{color:var(--sub);font-weight:700;font-size:12px}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.conf{position:fixed;top:-20px;width:12px;height:12px;border-radius:3px;z-index:60;pointer-events:none}
.chat-wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;height:calc(100vh - 130px)}
.chat-box{flex:1;overflow-y:auto;padding:10px 4px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:82%;padding:11px 15px;border-radius:18px;font-weight:600;font-size:16px;line-height:1.8;border:2px solid var(--line)}
.msg.bot{align-self:flex-start;background:var(--card);border-bottom-right-radius:6px}
.msg.me{align-self:flex-end;background:var(--yell);color:#2B2620;border-color:var(--yell-d);border-bottom-left-radius:6px}
.msg .wcard{border:2px solid var(--line);border-radius:13px;padding:10px 14px;margin-top:8px;background:var(--bg);text-align:right}
.msg .wcard b{font-size:20px}
.chat-quick{display:flex;gap:7px;overflow-x:auto;padding:8px 2px}
.chat-quick button{flex-shrink:0;padding:7px 14px;border-radius:999px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:13px;color:var(--sub)}
.chat-in{display:flex;gap:8px}
.chat-in .inp{flex:1}
.scen-row{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;border:2px solid var(--line);border-radius:16px;background:var(--card);margin-bottom:10px;text-align:right;box-shadow:var(--shadow)}
.scen-row b{font-size:17px;display:block}
.scen-row small{color:var(--sub);font-weight:600}
.scen-row .sic{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.scen-row .sic svg{width:24px;height:24px}
.bubble-bird{display:flex;gap:10px;align-items:flex-end;margin-bottom:10px}
.bubble-bird .bb-t{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 14px;max-width:78%}
.prof-head{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.stat-grid{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.ach-row{display:flex;align-items:center;gap:14px;padding:13px 15px;border:2px solid var(--line);border-radius:16px;background:var(--card);margin-bottom:10px}
.ach-row .aic{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--line);color:var(--sub)}
.ach-row.got .aic{background:var(--yell);color:#2B2620}
.ach-row .bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin-top:5px}
.ach-row .bar i{display:block;height:100%;background:var(--yell)}
.set-row{display:flex;align-items:center;gap:12px;padding:14px 6px;border-bottom:2px solid var(--line)}
.set-row b{font-size:16px}
.set-row small{display:block;color:var(--sub);font-weight:600}
.seg{display:flex;border:2px solid var(--line2);border-radius:12px;overflow:hidden;margin-inline-start:auto}
.seg button{padding:7px 14px;font-weight:800;font-size:13px;background:var(--card);color:var(--sub)}
.seg button.on{background:var(--ink);color:var(--bg)}
.sw{position:relative;width:50px;height:28px;border-radius:99px;background:var(--line2);margin-inline-start:auto;transition:background .2s;flex-shrink:0}
.sw i{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:right .2s}
.sw.on{background:var(--grn)}.sw.on i{right:25px}
#modal-wrap{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;background:rgba(30,25,15,.5);padding:18px}
#modal-wrap.on{display:flex}
#modal{max-width:560px;width:100%;max-height:88vh;overflow-y:auto;background:var(--card);border:2px solid var(--line);border-radius:22px;padding:22px;text-align:center;animation:pop .25s}
#toasts{position:fixed;top:66px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:92vw}
.toast{background:var(--ink);color:var(--bg);padding:9px 20px;border-radius:999px;font-weight:700;font-size:14px;animation:pop .3s;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.speech-tip{position:absolute;background:var(--ink);color:var(--bg);padding:7px 14px;border-radius:13px;font-weight:700;font-size:13px;white-space:nowrap;animation:pop .25s;z-index:5}
.speech-tip::after{content:"";position:absolute;bottom:-7px;right:24px;border:8px solid transparent;border-top-color:var(--ink);border-bottom:0}
.teach-head{display:flex;align-items:center;gap:12px;max-width:560px;margin:0 auto 10px}
.teach-prog{max-width:560px;margin:0 auto 14px;display:flex;align-items:center;gap:10px}
.teach-card{max-width:560px;margin:0 auto;padding:22px;text-align:center}
.teach-word{font-size:40px;font-weight:800;margin:10px 0 2px}
.teach-tl{color:var(--sub);font-weight:700}
.teach-ar{font-size:26px;font-weight:800;color:var(--yell-d);margin-top:6px}
.teach-ex{margin-top:14px;padding:12px;border:2px dashed var(--line2);border-radius:14px;font-weight:700}
.teach-btns{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.quiz-card{max-width:560px;margin:0 auto;padding:20px;text-align:center}
.birdSVG{overflow:visible}
.birdSVG .wing{transform-box:fill-box;transform-origin:85% 15%}
.b-happy{animation:hop .55s ease}
.b-happy .wing{animation:flap .28s ease-in-out 2}
.b-sad .crest{transform:rotate(22deg)}
.b-sad{animation:sag .5s ease}

function buildCurr(lang){

 CURR[lang]=UNITS.map(u=>{
  const lessons=u.plan.map(p=>{
   if(u.kind==='l'){
    const tags=p[1].split(',');
    return{t:p[0],words:B.w.filter(w=>tags.includes(w.tag)),sents:[]};
   }
   if(u.kind==='r'){
    const tags=p[1].split(',');
    return{t:p[0],words:B.w.filter(w=>tags.includes(w.tag)).slice(0,8),sents:B.s.slice(p[2],p[3])};
   }
   if(u.kind==='s'||u.kind==='g'){
    const sents=B.s.slice(p[1],p[2]);
    const words=B.w.filter(w=>sents.some(s=>s.k.toLowerCase().includes(w.k.toLowerCase())));
    return{t:p[0],words,sents};
   }
   const ws=B.w.filter(w=>w.tag===p[1]).slice(p[2],p[3]);
   if(!ws.length)console.warn('درس بدون كلمات:',p[0],p[1],p[2],p[3]);
   return{t:p[0],words:ws,sents:[]};
  });
  return{t:u.t,ic:u.ic,col:u.col,kind:u.kind,lessons};
 });
 return CURR[lang];
}

function genExercises(lang,ui,li){
 const cur=buildCurr(lang),unit=cur[ui],lesson=unit.lessons[li];
 const R=rng(lang+':'+ui+':'+li+':'+(U?U.seed||'1':'1'));
 const B=BANK[lang];
 const W=lesson.words,S=lesson.sents,ex=[];
 const add=f=>ex.push(f);
 if(unit.kind==='r'){
  const para=S.length?S.slice(0,3):B.s.slice(0,3);
  add(exRead(para,lang,R,'sent'));
  if(W[0])add(exMCQ(W[0],1,lang,R));
  add(exRead(para,lang,R,'word'));
  if(W.length>3){add(exMatch(W,lang,R));add(exListen(W[1],lang,R,false))}
  add(exTransSent(para[0],lang,R));
  if(W.length>2)add(exMCQ(W[2],0,lang,R));
  if(W[1])add(exSpeak(W[1],lang));
 }else if(unit.kind==='l'){
  const pool=W.length?W:B.w.slice(0,10);
  for(let i=0;i<Math.min(6,pool.length);i++)add(exListen(pool[i],lang,R,i%2===1));
  if(pool.length>=4)add(exMatch(pool.slice(0,4),lang,R));
  const pw=pool.find(w=>w.pic);
  if(pw)add(exPic(pw,lang,R));else if(pool[6])add(exMCQ(pool[6],1,lang,R));
  if(pool[7])add(exMCQ(pool[7],0,lang,R));
  if(pool[8])add(exListen(pool[8],lang,R,true));
 }else{
  if(unit.kind==='g'){
   const gr=B.gr[li%B.gr.length];
   add({hint:'اقرأ القاعدة أولًا',mount(box,done){
    box.innerHTML=`<div class="q-title">قاعدة من مدرس كوكتيل</div><div class="para-card card" style="font-size:17px;line-height:2">${esc(gr)}</div><div style="text-align:center"><button class="btn btn-y" id="ok1">فهمت، هيّا نبدأ</button></div>`;
    $('#ok1',box).onclick=()=>done(true,null,{});
   }});
  }
  const list=(W.length?W:shuffle(B.w,R).slice(0,8)).slice(0,8);
  if(list[0])add(exMCQ(list[0],1,lang,R));
  if(list[1])add(exListen(list[1],lang,R,false));
  const pw=list.find(w=>w.pic);
  if(pw)add(exPic(pw,lang,R));else if(list[2])add(exMCQ(list[2],0,lang,R));
  if(list.length>=4)add(exMatch(list,lang,R));
  const short=[...list].sort((a,b)=>a.ar.length-b.ar.length)[0];
  if(short)add(exWrite(short,lang));
  if(S.length){
   add(exTransSent(S[0],lang,R));
   add(B.cjk?exFill(S[1]||S[0],lang,R):exOrder(S[1]||S[0],lang,R));
   const sp=list[2]||list[0];
   if(sp)add(exSpeak(sp,lang));
   if(S[2])add(exFill(S[2],lang,R));
   if(list[3])add(exMCQ(list[3],1,lang,R));
   if(S[3])add(exTransSent(S[3],lang,R));
  }else{
   if(list[3])add(exMCQ(list[3],1,lang,R));
   if(list[4])add(exListen(list[4],lang,R,true));
   if(list[5])add(exMCQ(list[5],0,lang,R));
   if(list[6])add(exMCQ(list[6],1,lang,R));
   const sp2=list[2]||list[0];
   if(sp2)add(exSpeak(sp2,lang));
  }
 }
 return ex.slice(0,9);
}

/* ═══════ 10) التخزين — حسابات متعددة بنفس الاسم ═══════ */
const DB_KEY='koktail_db_v1';
let DB={users:{},session:null};
function dbLoad(){try{DB=JSON.parse(localStorage.getItem(DB_KEY))||{users:{},session:null}}catch(e){DB={users:{},session:null}}}
function dbSave(){try{localStorage.setItem(DB_KEY,JSON.stringify(DB))}catch(e){}}
let U=null;
function usersByName(name){return Object.values(DB.users).filter(u=>norm(u.name)===norm(name))}
function newUser(name,age){
 const id='u'+Date.now().toString(36)+Math.floor(Math.random()*99);
 DB.users[id]={id,name,age:String(age),seed:Math.floor(Math.random()*9999),
  nickname:'',avatar:{skin:AV.skins[0],hair:'short',hairC:AV.hairC[0],clothes:'tee',clothC:AV.clothC[0],shoes:AV.shoes[0],glasses:'none',hat:'none',acc:'none',bg:'dots'},
  bird:'koktail',lang:null,startUnit:0,
  xp:0,streak:0,lastDay:null,todayTouched:false,hearts:5,
  words:{},prog:{},done:0,revCount:0,ach:{},teach:null,teachCount:0,
  daily:{date:dayKey(),xp:0,words:0,answers:0,lessons:0,reviews:0,claimed:{}},
  chat:[],settings:{theme:'light',sound:true,autospeak:true,goal:20,notif:false}};
 DB.session=id;dbSave();return DB.users[id];
}
const loadUser=()=>{if(!DB.session)return null;U=DB.users[DB.session];dayRefresh();return U};
const save=()=>{if(U)DB.users[U.id]=U;dbSave()};
function dayRefresh(){
 if(!U)return;
 if(U.daily&&U.daily.date!==dayKey()){
  U.daily={date:dayKey(),xp:0,words:0,answers:0,lessons:0,reviews:0,claimed:{}};
  U.hearts=Math.min(5,(U.hearts||0)+2);U.todayTouched=false;save();
  if(U.settings&&U.settings.notif&&'Notification'in window&&Notification.permission==='granted'){
   try{new Notification('كوكتيل 🦜',{body:'طائرك ينتظرك! أكمل هدف اليوم وحافظ على سلسلتك.'})}catch(e){}
  }
 }
}

/* ═══════ 11) محرك التقدم ═══════ */
function touchStreak(){
 if(U.todayTouched)return;
 U.todayTouched=true;
 U.streak=(U.lastDay===yesterdayKey())?(U.streak||0)+1:((U.lastDay===dayKey())?U.streak:1);
 U.lastDay=dayKey();
}
function addXP(n,why){
 U.xp+=n;U.daily.xp+=n;touchStreak();checkAch();save();renderHUD();
 if(why)toast(`+${n} XP — ${why}`);
}
const lvlOf=x=>x<100?{n:'مبتدئ'}:x<400?{n:'متعلم'}:x<1000?{n:'متقدم'}:{n:'خبير'};
function loseHeart(){
 U.hearts=Math.max(0,U.hearts-1);save();renderHUD();
 if(L)L.hearts=U.hearts;
 return U.hearts;
}
const CHAL=[
 {id:'w10',t:'تعلّم 10 كلمات اليوم',goal:10,get:u=>u.daily.words},
 {id:'l2',t:'أكمل درسين اليوم',goal:2,get:u=>u.daily.lessons},
 {id:'q20',t:'أجب عن 20 سؤالًا اليوم',goal:20,get:u=>u.daily.answers},
 {id:'rev',t:'أكمل جلسة مراجعة',goal:1,get:u=>u.daily.reviews},
];
function bumpChal(key){
 const c=CHAL.find(x=>x.id===key);
 if(!c)return;
 if(c.get(U)>=c.goal&&!U.daily.claimed[c.id]){
  U.daily.claimed[c.id]=true;U.xp+=20;U.daily.xp+=20;
  toast(`تحدي مكتمل: ${c.t} (+20 XP)`);
 }
 save();
}
const ACH=[
 {id:'first',t:'أول درس',d:'أكمل درسك الأول',p:u=>Math.min(1,u.done/1)},
 {id:'xp100',t:'أول 100 نقطة',d:'اجمع 100 XP',p:u=>Math.min(1,u.xp/100)},
 {id:'st7',t:'أسبوع من الطيران',d:'سلسلة 7 أيام متتالية',p:u=>Math.min(1,u.streak/7)},
 {id:'w30',t:'صائد الكلمات',d:'تعلّم 30 كلمة',p:u=>Math.min(1,userWordCountOf(u)/30)},
 {id:'teach10',t:'تلميذ كوكتيل',d:'أتممت 10 كلمات مع المدرس',p:u=>Math.min(1,(u.teachCount||0)/10)},
 {id:'u1',t:'فاتح الوحدة',d:'أكمل الوحدة الأولى كاملة',p:u=>Math.min(1,Object.keys(u.prog).filter(k=>k.startsWith('0:')).length/unitTotal(0))},
 {id:'perf',t:'درس مثالي',d:'أكمل درسًا بدون أي خطأ',p:u=>u.ach.perfect?1:0},
 {id:'rev5',t:'ذاكرة قوية',d:'أكمل 5 جلسات مراجعة',p:u=>Math.min(1,u.revCount/5)},
 {id:'l10',t:'طائر مجتهد',d:'أكمل 10 دروس',p:u=>Math.min(1,u.done/10)},
];
function userWordCountOf(u){
 return Object.keys(u.words||{}).filter(k=>{
  if(!k.startsWith((u.lang||'')+':'))return false;
  const kk=k.slice((u.lang||'').length+1);
  return !kk.startsWith('s:')&&!kk.startsWith('p:');
 }).length;
}
function userWordCount(){return userWordCountOf(U)}
function checkAch(){
 ACH.forEach(a=>{
  if(!U.ach[a.id]&&a.p(U)>=1){U.ach[a.id]=dayKey();U.xp+=25;U.daily.xp+=25;toast(`إنجاز جديد: ${a.t} (+25 XP)`);birdSay('تهانينا! إنجاز جديد!')}
 });
}

/* ═══════ 12) الصوت ═══════ */
function speak(text,lang){
 if(!U||U.settings.sound===false)return;
 if(!('speechSynthesis' in window))return;
 try{
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  const l=LANGS.find(x=>x.id===lang);
  u.lang=(l&&l.speech)||'en-US';u.rate=.85;
  speechSynthesis.speak(u);
 }catch(e){}
}
let birdBubble=null;
function birdSay(t){
 const el=document.querySelector('.av-scene .bwrap');
 if(!el){toast(t);return}
 if(birdBubble)birdBubble.remove();
 const d=document.createElement('div');d.className='speech-tip';d.textContent=t;
 d.style.top='-34px';d.style.right='0';
 el.appendChild(d);birdBubble=d;
 setTimeout(()=>{d.remove();if(birdBubble===d)birdBubble=null},2600);
}

 else if(s==='lang')inner=`<h2 class="ob-title">ماذا تريد أن تتعلم؟</h2><p class="ob-sub">اختر لغتك وستبدأ الرحلة فورًا</p><div style="max-width:440px;margin:0 auto">${LANGS.map(l=>`<button class="lang-row" data-l="${l.id}" onclick="A.obLang(this)"><span class="glyph">${esc(l.g)}</span><span>${l.n}<small>منهج كامل بوحدات ودروس</small></span></button>`).join('')}</div>`;
 else if(s==='level'){
  const lg=LANGS.find(l=>l.id===OB.draft.lang)||LANGS[0];
  inner=`<h2 class="ob-title">من أين تبدأ؟</h2><p class="ob-sub">${lg.n}</p>
  <button class="big-opt" onclick="A.obLevel(0)">البدء من الصفر<small>مثالي للمبتدئين — نبدأ من التحيات</small></button>
  <button class="big-opt" onclick="A.obTest()">اختبار تحديد المستوى<small>أسئلة سريعة لنضعك في المكان الصحيح</small></button>`;
 }
 box.innerHTML=`<div class="wrap"><div class="step-dots">${dots}</div>${inner}</div>
  <div class="ob-foot">${(s!=='lang'&&s!=='level')?`<button class="btn btn-o" onclick="A.obBack()" ${OB.step===0?'style="visibility:hidden"':''}>رجوع</button><button class="btn btn-y" style="min-width:150px" onclick="A.obNext()">متابعة</button>`:''}</div>`;
 if(s==='avatar')mountAvatarEditor($('#av-holder'),OB.draft.avatar,null);
 if(s==='bird'){
  const bc=$('#bird-cards');
  BIRD_TYPES.forEach(b=>{
   const d=document.createElement('button');
   d.className='bird-card'+(OB.draft.bird===b.id?' on':'');
   d.innerHTML=`<div style="display:flex;justify-content:center">${birdSVG(b,'idle',84)}</div><b>${b.n}</b><small>${b.d}</small>`;
   d.onclick=()=>{

   };
   bc.appendChild(d);
  });
 }

function mountAvatarEditor(holder,cfg,onSave){

  ['skin',()=>AV.skins.map(c=>({v:c,sw:c}))],
  ['hair',()=>AV.styles.map(v=>({v,mini:{hair:v}}))],
  ['hairC',()=>AV.hairC.map(c=>({v:c,sw:c}))],

function currentLessonPos(){
 let curU=U.startUnit,curL=0;
 outer:for(let ui=U.startUnit;ui<UNITS.length;ui++){
  for(let li=0;li<unitTotal(ui);li++){
   if(!U.prog[ui+':'+li]){curU=ui;curL=li;break outer}
  }
 }
 return{curU,curL};
}

/* ---- آلة حالة الدرس ---- */
function startLesson(cfg){
 closeModal();
 L=Object.assign({},cfg,{
  i:0,hearts:U.hearts,wrong:0,
  newWords:new Set(),touchedWords:new Set(),_wrongWords:new Set(),
  noHearts:false,_adv:false,_triedThis:false,_pendingMiss:0,_hWarned:false
 });
 show('app');renderHUD();renderNav();
 $$('#nav button').forEach(b=>b.classList.remove('on'));
 renderLessonStep();
}
function heartNote(){
 if(U.hearts<=0&&!L._hWarned){L._hWarned=true;toast('خلصت القلوب — لا مشكلة، كمّل عادي! 🦜')}
}
function renderLessonStep(){
 if(!L)return;
 L._adv=false;L._triedThis=false;L._pendingMiss=0;
 $('#fb').classList.remove('on');
 if(L.i>=L.ex.length)return finishLesson();
 const ex=L.ex[L.i];
 $('#main').innerHTML=`<div id="les-top" style="max-width:640px;margin:0 auto">
  <button class="chip" onclick="A.quitLesson()" title="خروج">${ic('x',16)}</button>
  <div class="pbar"><i style="width:${Math.round(L.i/L.ex.length*100)}%"></i></div>
  <span class="chip" style="color:var(--red)">${ic('heart',15)}<span class="n">${L.noHearts?'∞':L.hearts}</span></span>
  <span style="width:46px;height:46px;flex-shrink:0">${birdSVG(BIRD_TYPES.find(b=>b.id===U.bird),'idle',46)}</span></div>
  ${ex.hint?`<p class="les-hint">${esc(ex.hint)}</p>`:''}
  <div id="les-body"></div>`;
 L.ex[L.i].mount($('#les-body'),(ok,explain,meta)=>judge(ok,explain,meta));
}
function fbGo(onNext){
 if(!L||L._adv)return;
 L._adv=true;
 $('#fb').classList.remove('on');
 if(onNext)onNext();
 else{L.i++;renderLessonStep()}
}
function judge(ok,explain,meta){
 if(!L)return;
 if(!ok&&!L._triedThis){
  L._triedThis=true;L._pendingMiss=1;
  showFB(false,explain||'ليس تمامًا. حاول مرة أخرى.',true);
  return;
 }
 if(ok){
  const miss=(meta&&meta.miss)||0;
  if(miss>0){
   L.wrong+=miss;
   const wk=(meta.word&&meta.word.k)||(meta.sent&&meta.sent.k);
   if(wk)L._wrongWords.add(wk);
   if(!L.noHearts){loseHeart();L.hearts=U.hearts;heartNote()}
  }
  if(meta&&meta.word){
   const key=U.lang+':'+meta.word.k;
   if(!U.words[key])L.newWords.add(meta.word);
   registerWord(meta.word);
   L.touchedWords.add(meta.word.k);
  }
  if(meta&&meta.sent&&meta.sent.k){
   const sk=U.lang+':s:'+meta.sent.k;
   if(!U.words[sk])U.words[sk]={b:1,ws:0,t:Date.now()};
  }
  U.daily.answers++;bumpChal('q20');addXP(1);
  const okTxt=(meta&&meta.word)?`<bdi>${esc(meta.word.k)}</bdi> = ${esc(meta.word.ar)}`
   :((meta&&meta.sent)?`<bdi>${esc(meta.sent.k)}</bdi> = ${esc(meta.sent.ar)}`:(explain||''));
  showFB(true,okTxt,false);
  setTimeout(()=>fbGo(),1000);
 }else{
  L._pendingMiss=0;L.wrong++;
  if(!L.noHearts){loseHeart();L.hearts=U.hearts;heartNote()}
  showFB(false,explain||'ليس تمامًا.',false);
 }
}
function judge2(ok,explain,meta){
 if(!L)return;
 if(ok){
  if(L._pendingMiss){
   L.wrong+=L._pendingMiss;
   if(!L.noHearts){loseHeart();L.hearts=U.hearts;heartNote()}
   L._pendingMiss=0;
  }
  const miss=(meta&&meta.miss)||0;
  if(miss>0){
   L.wrong+=miss;
   if(meta.word)L._wrongWords.add(meta.word.k);
  }
  if(meta&&meta.word){
   const key=U.lang+':'+meta.word.k;
   if(!U.words[key])L.newWords.add(meta.word);
   registerWord(meta.word);L.touchedWords.add(meta.word.k);
  }
  U.daily.answers++;bumpChal('q20');addXP(1);
  showFB(true,'أحسنت في المحاولة الثانية!',false);
  setTimeout(()=>fbGo(),1000);
 }else{
  L._pendingMiss=0;L.wrong++;
  if(!L.noHearts){loseHeart();L.hearts=U.hearts;heartNote()}
  showFB(false,explain||'ليس هذه المرة.',false);
 }
}
function showFB(good,txt,canRetry){
 const fb=$('#fb');
 fb.classList.remove('good','bad');
 fb.classList.add('on',good?'good':'bad');
 fb.innerHTML=`<span class="fb-bird" style="width:52px;flex-shrink:0">${birdSVG(BIRD_TYPES.find(b=>b.id===U.bird),good?'happy':'sad',52)}</span>
 <div class="fb-txt"><b>${good?'صحيح! 🎉':'ليس تمامًا. حاول مرة أخرى.'}</b><small>${txt||''}</small></div>
 ${canRetry?`<button class="btn btn-o btn-sm" style="box-shadow:none" id="fb-retry">أعد المحاولة</button>`:''}
 <button class="btn ${good?'btn-g':'btn-r'} btn-sm" style="box-shadow:0 2px 0 rgba(0,0,0,.25)" id="fb-next">${good?'متابعة':canRetry?'أرني الإجابة':'متابعة'}</button>`;
 if(canRetry){
  $('#fb-retry').onclick=()=>{
   fb.classList.remove('on');
   const box=$('#les-body');box.innerHTML='';
   L.ex[L.i].mount(box,(ok2,ex2,meta2)=>judge2(ok2,ex2,meta2));
  };
  $('#fb-next').onclick=()=>{
   if(L._adv)return;L._adv=true;fb.classList.remove('on');
   L.wrong++;
   if(!L.noHearts){loseHeart();L.hearts=U.hearts;heartNote()}
   L.i++;renderLessonStep();
  };
 }else{
  $('#fb-next').onclick=()=>fbGo();
 }
}

function registerWord(w){
 const key=U.lang+':'+w.k;
 if(!U.words[key]){U.words[key]={b:0,ws:0,t:Date.now()};U.daily.words++;bumpChal('w10')}
}
function touchWord(w,ok){
 const key=U.lang+':'+w.k;
 if(!U.words[key])U.words[key]={b:0,ws:0,t:Date.now()};
 const rec=U.words[key];
 rec.t=Date.now();
 if(ok)rec.b=Math.min(5,rec.b+1);
 else{rec.ws++;rec.b=Math.max(0,rec.b-1)}
}

/* ---- النتائج ---- */
function finishLesson(){
 const total=L.ex.length,correct=Math.max(0,total-L.wrong);
 const acc=total?Math.round(correct/total*100):100;
 const stars=acc===100?3:acc>=70?2:1;
 const isPlacement=!!L.placement,isReview=!!L.isReview;
 const xp=L.noHearts?Math.round((10+correct*2)/2):(10+correct*2+(stars===3?10:0));
 const wordApply=()=>{
  [...L.touchedWords].forEach(k=>{
   const w=(L.words||[]).find(x=>x.k===k)||BANK[U.lang].w.find(x=>x.k===k);
   if(w)touchWord(w,!L._wrongWords.has(k));
  });
 };
 if(isPlacement){
  const place=L.wrong<=2?2:L.wrong<=5?1:0;
  U.startUnit=place;
  U.lang=OB.draft.lang||U.lang;buildCurr(U.lang);
 }else if(isReview){
  U.revCount++;U.daily.reviews++;bumpChal('rev');
  wordApply();
 }else{
  const key=L.ui+':'+L.li;
  const first=!U.prog[key];
  if(!U.prog[key]||U.prog[key]<stars)U.prog[key]=stars;
  if(first){U.done++;U.daily.lessons++;bumpChal('l2')}
  if(L.wrong===0)U.ach.perfect=true;
  wordApply();
 }
 if(U.hearts<3){U.hearts=Math.min(5,U.hearts+3);toast('قلوب جديدة لرحلتك! ❤️')}
 checkAch();save();
 const newW=[...L.newWords];
 const uiDone=!isPlacement&&!isReview&&L.ui!==undefined;
 $('#main').innerHTML=`<div class="center" style="min-height:calc(100vh - 120px)">
  <div style="display:flex;justify-content:center">${birdSVG(BIRD_TYPES.find(b=>b.id===U.bird),'happy',120)}</div>
  <h2 style="font-size:32px">أحسنت! 🎉</h2>
  <div class="res-stars">${[1,2,3].map(i=>`<svg viewBox="0 0 24 24" class="${i<=stars?'lit':''}" style="animation-delay:${i*0.25}s">${IC.star}</svg>`).join('')}</div>
  <div class="res-stats">
   <div class="res-stat"><b style="color:var(--yell-d)">+${xp}</b><small>نقاط XP</small></div>
   <div class="res-stat"><b>${newW.length}</b><small>كلمات جديدة</small></div>
   <div class="res-stat"><b style="color:var(--red)">${L.wrong}</b><small>أخطاء</small></div>
   <div class="res-stat"><b style="color:var(--grn)">${acc}%</b><small>نسبة النجاح</small></div>
  </div>
  ${uiDone?`<p class="muted" style="font-weight:700">تقدم الوحدة: ${buildCurr(U.lang)[L.ui].lessons.filter((_,i)=>U.prog[L.ui+':'+i]).length} / ${unitTotal(L.ui)} دروس</p>`:''}
  ${isPlacement?`<p class="card" style="padding:12px 20px;font-weight:800">حدد لك مدرس كوكتيل نقطة البداية: <span style="color:var(--yell-d)">الوحدة ${U.startUnit+1} — ${UNITS[U.startUnit].t}</span></p>`:''}
  <div style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;justify-content:center">
   ${uiDone&&L.li<unitTotal(L.ui)-1?`<button class="btn btn-y" onclick="A.nextLesson()">الدرس التالي ${ic('arr',18)}</button>`:''}
   <button class="btn btn-o" onclick="A.resHome()">العودة للمسار</button>
  </div></div>`;
 confetti();
 addXP(xp);
}

function confetti(){
 const cols=['#F2B705','#F07F3C','#3E9B4F','#2FA98C','#C4547F'];
 for(let i=0;i<26;i++){
  const c=document.createElement('div');c.className='conf';
  c.style.background=cols[Math.floor(Math.random()*cols.length)];
  c.style.left=(Math.random()*100)+'vw';
  document.body.appendChild(c);
  const dur=1200+Math.random()*1400;
  c.animate([{transform:'translateY(0) rotate(0)'},{transform:`translateY(${window.innerHeight+40}px) rotate(${540+Math.random()*360}deg)`}],{duration:dur,easing:'cubic-bezier(.3,.6,.6,1)'});
  setTimeout(()=>c.remove(),dur);
 }
}

/* ---- المراجعة ---- */
function dueWords(){
 const now=Date.now(),gaps=[0,1,2,4,7,15].map(d=>d*864e5);
 const due=[],weak=[];
 for(const[key,rec]of Object.entries(U.words)){
  if(!key.startsWith(U.lang+':'))continue;
  const kk=key.slice(U.lang.length+1);
  if(kk.startsWith('s:')||kk.startsWith('p:'))continue;
  const w=BANK[U.lang].w.find(x=>x.k===kk);
  if(!w)continue;
  if(now-rec.t>gaps[rec.b])due.push(w);
  if(rec.ws>0&&!due.includes(w))weak.push(w);
 }
 return{due,weak:[...new Set([...due,...weak])]};
}
function renderReview(){
 const{weak}=dueWords();
 const strong=userWordCount();
 $('#main').innerHTML=`<div class="center">
 <div style="display:flex;justify-content:center">${birdSVG(BIRD_TYPES.find(b=>b.id===U.bird),'idle',100)}</div>

 <div class="res-stats">
  <div class="res-stat"><b>${weak.length}</b><small>كلمات بحاجة لمراجعة</small></div>
  <div class="res-stat"><b>${strong}</b><small>في ذاكرتك</small></div>
 </div>
 ${weak.length?`<button class="btn btn-t" style="font-size:18px" onclick="A.startRevBtn()">${ic('refresh',18)} ابدأ جلسة المراجعة</button>`
 :`<p class="card" style="padding:14px 22px;font-weight:800">كل كلماتك قوية الآن! عد عند تعلم كلمات جديدة</p>`}
 <p class="muted" style="font-weight:600;font-size:13px;margin-top:10px">كل جلسة مراجعة تمنحك XP وتقوّي ذاكرتك</p></div>`;
}
A.startRevBtn=()=>startReview(false);
function startReview(fromBreak){
 const{weak}=dueWords();
 const pool=weak.length?weak.slice(0,8):BANK[U.lang].w.slice(0,6);
 const R=rng('rev'+Date.now());
 const ex=[];
 pool.slice(0,5).forEach((w,i)=>ex.push(i%2?exListen(w,U.lang,R,false):exMCQ(w,1,U.lang,R)));
 if(pool.length>4)ex.push(exMatch(pool.slice(1,5),U.lang,R));
 pool.slice(5,7).forEach(w=>ex.push(exMCQ(w,0,U.lang,R)));
 if(pool[0])ex.push(exSpeak(pool[0],U.lang));
 startLesson({title:'مراجعة',ex:ex.slice(0,8),isReview:true,words:pool});
}

/* ═══════ 13-b) مدرسة كوكتيل ═══════ */
const TCACHE={};
let TE={items:null,lang:null};
const TAG_ORDER=['g','q','n','c','f','fam','a','v','adj','pl','t'];
function teachList(lang){
 if(TCACHE[lang])return TCACHE[lang];
 const B=BANK[lang],items=[];
 TAG_ORDER.forEach(tag=>{
  const ws=B.w.filter(w=>w.tag===tag);
  if(ws.length){items.push({type:'label',t:TAG_NAMES[tag]||tag});ws.forEach(w=>items.push({type:'word',w,tag}))}
 });
 B.s.forEach(s=>items.push({type:'sent',s}));

A.teachNext=()=>{

function wordCard(w){
 return`<div class="wcard"><b><bdi>${esc(w.k)}</bdi></b> — ${esc(w.ar)}${w.tl?`<br><small class="muted">النطق: ${esc(w.tl)}</small>`:''}<br><button class="btn btn-o btn-sm" style="margin-top:6px" data-say="${esc(w.k)}" onclick="A.spkEl(this)">${ic('speaker',15)} استمع</button></div>`;
}

 meSay(t);

function tutorReply(raw){
 const t=raw.trim();
 const lang=U.lang,B=BANK[lang];
 let m=t.match(/(?:اشرح|معنى|ما معنى|explain|meaning|كلمة)\s*(?:كلمة\s*)?["«']?([\p{L}\p{N}'\- ]+)["»']?/u);
 if(m){
  const q=m[1].trim().replace(/[؟?.!]/g,'');
  const found=B.w.find(w=>norm(w.k)===norm(q)||norm(w.ar)===norm(q))
   ||B.w.find(w=>norm(w.k).includes(norm(q))||norm(w.ar).includes(norm(q)))
   ||Object.values(BANK).flatMap(b=>b.w).find(w=>norm(w.k)===norm(q));
  if(found)return`إليك الشرح:${wordCard(found)}<br>جرّب استخدامها في جملة وأرسلها لي لأصححها لك!`;
  return`لم أجد «${esc(q)}» في مفردات كوكتيل بعد. اكتبها بالإنجليزية أو بالعربية، أو جرّب: <b>اشرح كلمة Hello</b>`;
 }
 if(/قاعد|grammar|شرح القاعدة|النحو/.test(t)){
  return`قواعد ${LANGS.find(l=>l.id===lang).n} الأساسية:<br>`+B.gr.map((g,i)=>`<div class="wcard"><b>القاعدة ${i+1}:</b><br>${esc(g)}</div>`).join('');
 }
 m=t.match(/(?:صحح|صححلي|correct|تصحيح)[:\s]*(.+)/);
 if(m){
  const s=m[1].trim();
  const best=B.s.map(x=>[x,lev(norm(x.k),norm(s))/Math.max(norm(s).length,1)]).sort((a,b)=>a[1]-b[1])[0];
  if(best&&best[1]<0.55){
   const words=s.split(/\s+/),gold=best[0].k.split(/\s+/);
   const diffs=words.map((w,i)=>norm(w)!==norm(gold[i]||'')
    ?`<span style="color:var(--red);text-decoration:line-through">${esc(w)}</span> → <span style="color:var(--grn)"><bdi>${esc(gold[i]||'?')}</bdi></span>`
    :`<bdi>${esc(w)}</bdi>`).join(' ');
   return`وجدت الفرق! الصواب:<div class="wcard ltr"><bdi>${esc(best[0].k)}</bdi></div>التعديل: ${diffs}<br><small class="muted">المعنى: ${esc(best[0].ar)}</small>`;
  }
  return`جملتك غير موجودة عندي حرفيًا، لكن هذه جمل صحيحة مشابهة:<br>`+B.s.slice(0,3).map(s=>wordCard(Object.assign({},s,{tl:''}))).join('');
 }
 if(/مثال|أمثلة|example/.test(t)){
  const pool=B.s.filter(s=>B.w.some(w=>s.k.includes(w.k)));
  const ex=(pool.length?pool:B.s).slice(0,3);
  return`إليك أمثلة من مستواك الحالي (${UNITS[U.startUnit].t}):<br>`+ex.map(s=>`<div class="wcard"><bdi>${esc(s.k)}</bdi><br><small class="muted">${esc(s.ar)}</small></div>`).join('');
 }
 if(/اختبرني|سؤال|تدريب|quiz|اختبر/.test(t)){
  const R=rng('tq'+Date.now());
  const w=pick(B.w,R);
  const opts=shuffle([w.ar,...shuffle(B.w.filter(x=>x.k!==w.k),R).slice(0,3).map(x=>x.ar)],R);
  window._tq={a:w.ar};
  setTimeout(()=>{
   const b=$('#chat-box');if(!b)return;
   const d=document.createElement('div');d.className='msg bot';
   d.innerHTML=`سؤال سريع: ما معنى «<bdi>${esc(w.k)}</bdi>»؟<div style="display:flex;flex-direction:column;gap:6px;margin-top:8px">${opts.map(o=>`<button class="opt" style="padding:9px 12px;margin:0;font-size:15px" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
   b.appendChild(d);b.scrollTop=b.scrollHeight;
   d.querySelectorAll('.opt').forEach(bt=>bt.onclick=()=>{
    d.querySelectorAll('.opt').forEach(x=>x.style.pointerEvents='none');
    const ok=norm(bt.dataset.v)===norm(window._tq.a);
    bt.classList.add(ok?'ok':'no');
    const r=document.createElement('div');r.className='msg bot';
    r.textContent=ok?'أحسنت! إجابة صحيحة! 🎉':'ليس تمامًا. الصواب: '+window._tq.a;
    if(ok){addXP(2);touchWord(w,true)}else touchWord(w,false);
    b.appendChild(r);b.scrollTop=b.scrollHeight;
   });
  },400);
  return'جهّزت لك سؤالًا من مستواك... لحظة!';
 }
 if(/محادثة|حاورني|تدرب على المحادثة|conversation/.test(t))return`رائع! اضغط هنا لبدء محادثة: <button class="btn btn-t btn-sm" style="margin-top:6px" onclick="A.go('conv')">${ic('chat',15)} وضع المحادثة</button><br>اختر سيناريو مثل المطعم أو التعارف وسأحاورك خطوة بخطوة.`;
 if(/^(مرحبا|مرحبًا|اهلا|أهلا|السلام|هلا|hi|hello)/i.test(t))return`أهلًا وسهلًا ${U.nickname}! طائري مستعد للدرس. هل نبدأ بسؤال تدريبي أو شرح قاعدة؟`;
 if(/شكرا|شكرًا|thanks/i.test(t))return'على الرحب والسعة! كوك الكوك!';
 if(/كيف (حالك|أحالك)|how are you/i.test(t))return`أنا بخير وفي جاهزية كاملة! أنت اليوم في ${UNITS[U.startUnit].t} — هل نكمل درسًا؟`;
 return`فهمت قصدك تقريبًا! هذه قدراتي:<br>• «اشرح كلمة ...» — شرح أي كلمة<br>• «اشرح قاعدة» — قواعد لغتك<br>• «صحح جملتي: ...» — تصحيح فوري<br>• «أعطني أمثلة» · «اختبرني» · «لنتدرب على المحادثة»<br>جرّب واحدًا الآن!`;
}

function renderConv(){
 $('#main').innerHTML=`<h2>تدريب المحادثة</h2><p class="muted" style="font-weight:700;margin-bottom:16px">اختر سيناريو وحاور بالـ${LANGS.find(l=>l.id===U.lang).n} — الطائر يمثل الدور الآخر</p>

A.openScen=id=>{

 if(!s)return;

 window._conv={s,turns,i:0,right:0};

function convStep(){
 const cv=window._conv;
 if(!cv)return A.go('conv');
 if(cv.i>=cv.turns.length)return convEnd();
 const turn=cv.turns[cv.i];
 const R=rng('cv'+cv.i+((Date.now()%9999)|0));
 let html=`<div style="display:flex;justify-content:center;margin-bottom:10px">${birdSVG(BIRD_TYPES.find(b=>b.id===U.bird),'idle',86)}</div>
 <div class="bubble-bird" style="justify-content:center"><div class="bb-t"><b style="font-size:18px"><bdi>${esc(turn.bird.k)}</bdi></b><br><small class="muted">${esc(turn.bird.ar)}</small> <button class="btn btn-o btn-sm" style="padding:3px 9px" data-say="${esc(turn.bird.k)}" onclick="A.spkEl(this)">${ic('speaker',14)}</button></div></div>`;
 if(turn.ans){
  const wrongPool=Object.values(BANK[U.lang].p).filter(p=>p.k!==turn.ans.k&&p.ar!==turn.ans.ar);
  const opts=shuffle([turn.ans,...shuffle(wrongPool,R).slice(0,2)],R);
  html+=`<p style="text-align:center;font-weight:800;margin:10px 0">كيف ترد؟</p><div id="copts">${opts.map(o=>`<button class="opt" data-k="${esc(o.k)}"><bdi>${esc(o.k)}</bdi> <small class="muted" style="font-size:12px;margin-inline-start:auto">${esc(o.ar)}</small></button>`).join('')}</div>`;
 }else{
  html+=`<div style="text-align:center;margin-top:12px"><button class="btn btn-y" onclick="A.convNext()">متابعة</button></div>`;
 }
 $('#main').innerHTML=`<div class="chip" onclick="A.go('conv')" style="margin-bottom:10px;cursor:pointer">${ic('x',14)} إنهاء المحادثة</div>
 <div class="card" style="padding:18px;max-width:560px;margin:0 auto">${html}</div>
 <p style="text-align:center;font-weight:800;color:var(--sub);margin-top:10px">المحادثة ${cv.i+1}/${cv.turns.length} — ${cv.s.n}</p>`;
 const co=$('#copts');
 if(co)co.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
  const ok=norm(b.dataset.k)===norm(turn.ans.k);
  b.classList.add(ok?'ok':'no');
  co.querySelectorAll('.opt').forEach(x=>x.style.pointerEvents='none');
  if(ok)cv.right++;
  speak(turn.ans.k,U.lang);
  setTimeout(()=>{cv.i++;convStep()},1100);
 });
}
A.convNext=()=>{if(window._conv){window._conv.i++;convStep()}};
function convEnd(){
 const cv=window._conv;if(!cv)return;
 const{turns,right}=cv;
 const xp=15+right*3;
 turns.forEach(t=>{
  if(t.ans){
   const key=U.lang+':p:'+t.ans.k;
   if(!U.words[key]){U.words[key]={b:1,ws:0,t:Date.now()};U.daily.words++}
  }
 });
 bumpChal('w10');
 $('#main').innerHTML=`<div class="center">
 <div style="display:flex;justify-content:center">${birdSVG(BIRD_TYPES.find(b=>b.id===U.bird),'happy',110)}</div>
 <h2>محادثة رائعة!</h2>
 <p class="muted" style="font-weight:700">أجبت صحيحًا في ${right} من ${turns.filter(t=>t.ans).length} أدوار</p>
 <div class="res-stats"><div class="res-stat"><b style="color:var(--yell-d)">+${xp}</b><small>XP</small></div></div>
 <div style="display:flex;gap:10px"><button class="btn btn-y" onclick="A.go('conv')">سيناريو آخر</button><button class="btn btn-o" onclick="A.go('home')">الرئيسية</button></div></div>`;
 confetti();
 addXP(xp,'إكمال محادثة');
}

/* ---- الملف الشخصي ---- */
function renderProfile(){
 const lv=lvlOf(U.xp);
 const wordsN=userWordCount();
 const achN=ACH.filter(a=>U.ach[a.id]).length;
 $('#main').innerHTML=`<div class="card" style="padding:20px">
 <div class="prof-head">
  <div>${avatarSVG(U.avatar,150)}</div>
  <div style="flex:1;min-width:220px">
   <h2>${esc(U.name)} <span class="muted" style="font-size:16px;font-weight:700">«${esc(U.nickname)}»</span></h2>
   <p class="muted" style="font-weight:700">${LANGS.find(l=>l.id===U.lang).n}</p>
   <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
    <span class="chip" style="color:var(--yell-d)">${ic('crown',16)} ${lv.n}</span>
    <span class="chip" style="color:var(--org)">${ic('flame',16)} ${U.streak} يوم</span>
    <span class="chip" style="color:var(--red)">${ic('heart',16)} ${U.hearts}/5</span>
   </div>
   <div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap">
    <button class="btn btn-o btn-sm" onclick="A.editAvatar()">${ic('pen',15)} تعديل الشخصية</button>
    <button class="btn btn-o btn-sm" onclick="A.go('settings')">${ic('gear',15)} الإعدادات</button>
   </div>
  </div></div></div>
 <div class="stat-grid">
  <div class="res-stat"><b style="color:var(--yell-d)">${U.xp}</b><small>إجمالي XP</small></div>
  <div class="res-stat"><b>${U.done}</b><small>دروس مكتملة</small></div>
  <div class="res-stat"><b>${wordsN}</b><small>كلمات تعلمها</small></div>
  <div class="res-stat"><b style="color:var(--yell-d)">${achN}/${ACH.length}</b><small>إنجازات</small></div>
 </div>
 <h3 class="sec-title">${ic('book',18)} كلماتي (${wordsN})</h3>
 <button class="btn btn-o" style="width:100%" onclick="A.showWords()">عرض قائمة كلماتي</button>`;
}
A.showWords=()=>{
 const list=Object.entries(U.words).filter(([k])=>{
  if(!k.startsWith(U.lang+':'))return false;
  const kk=k.slice(U.lang.length+1);
  return !kk.startsWith('s:')&&!kk.startsWith('p:');
 });
 openScreenModal('كلماتي',list.length
  ?`<div style="max-height:340px;overflow:auto;text-align:right">${list.map(([k,r])=>{
    const w=BANK[U.lang].w.find(x=>x.k===k.slice(U.lang.length+1));
    return w?`<div class="ch-row"><b class="ltr"><bdi>${esc(w.k)}</bdi></b><span class="muted">${esc(w.ar)}</span><span style="margin-inline-start:auto;color:var(--yell-d)">${'●'.repeat(r.b)}${'○'.repeat(5-r.b)}</span></div>`:'';
   }).join('')}</div>`
  :'<p class="muted" style="font-weight:700">لم تتعلم كلمات بعد — ابدأ أول درس!</p>');
};

/* ---- الإنجازات ---- */
function renderAch(){
 $('#main').innerHTML=`<h2>الإنجازات 🏆</h2><p class="muted" style="font-weight:700;margin-bottom:14px">كل إنجاز يمنحك +25 XP</p>`+
 ACH.map(a=>{
  const p=a.p(U),got=!!U.ach[a.id];
  return`<div class="ach-row ${got?'got':''}">
  <span class="aic">${got?birdSVG(BIRD_TYPES.find(b=>b.id===U.bird),'happy',40):ic('trophy',24)}</span>
  <div style="flex:1"><b>${a.t}</b><small class="muted" style="display:block;font-weight:600">${a.d}${got?' — أُنجز في '+U.ach[a.id]:''}</small>
  ${got?'':`<div class="bar"><i style="width:${Math.round(p*100)}%"></i></div>`}</div>
  ${got?`<span style="color:var(--grn)">${ic('check',22)}</span>`:`<b class="muted" style="font-size:13px">${Math.round(p*100)}%</b>`}</div>`;
 }).join('');
}

/* ---- الإعدادات ---- */
function renderSettings(){
 const s=U.settings;
 const row=(t,d,ctrl)=>`<div class="set-row"><div style="flex:1"><b>${t}</b><small>${d}</small></div>${ctrl}</div>`;
 $('#main').innerHTML=`<h2 style="margin-bottom:10px">الإعدادات</h2>
 ${row('الحساب','اسمك: '+esc(U.name)+' · العمر مخفي (خاص بك)',`<button class="btn btn-o btn-sm" onclick="A.editName()">تعديل</button>`)}
 ${row('الشخصية','غيّر شكلك وطائرك في كل التطبيق',`<button class="btn btn-o btn-sm" onclick="A.editAvatar()">تعديل</button>`)}
 ${row('اللغة','اللغة الحالية: '+LANGS.find(l=>l.id===U.lang).n,`<button class="btn btn-o btn-sm" onclick="A.editLang()">تغيير</button>`)}
 ${row('الأصوات','تشغيل النطق والمؤثرات',`<div class="sw ${s.sound?'on':''}" onclick="A.tgl('sound',this)"><i></i></div>`)}
 ${row('النطق التلقائي','نطق الكلمات عند ظهورها',`<div class="sw ${s.autospeak?'on':''}" onclick="A.tgl('autospeak',this)"><i></i></div>`)}
 ${row('الإشعارات','تذكير يومي لحفظ السلسلة',`<div class="sw ${s.notif?'on':''}" onclick="A.tglNotif(this)"><i></i></div>`)}
 ${row('الهدف اليومي','XP الذي تستهدفه كل يوم',`<div class="seg">${[10,20,30,50].map(g=>`<button class="${s.goal===g?'on':''}" onclick="A.setGoal(${g})">${g}</button>`).join('')}</div>`)}
 ${row('المظهر','الوضع الفاتح أو الداكن — يُحفظ اختيارك',`<div class="seg"><button class="${s.theme==='light'?'on':''}" onclick="A.setTheme('light')">${ic('sun',14)} فاتح</button><button class="${s.theme==='dark'?'on':''}" onclick="A.setTheme('dark')">${ic('moon',14)} داكن</button></div>`)}
 ${row('الخصوصية','عمرك لا يظهر لأي مستخدم أبدًا ويبقى على جهازك فقط',`<span class="chip" style="color:var(--grn)">${ic('shield',16)} محمي</span>`)}
 <div style="display:flex;gap:10px;margin-top:22px;flex-wrap:wrap">
  <button class="btn btn-o" onclick="A.logout()">${ic('out',17)} تسجيل الخروج</button>
  <button class="btn btn-r" onclick="A.delAcc()">${ic('x',17)} حذف الحساب نهائيًا</button>
 </div>`;
}
A.editName=()=>{
 openScreenModal('تعديل الحساب',`<p class="muted" style="font-weight:600;margin-bottom:12px">عند الدخول باسمك هتلاقي كل حساباتك باسمك في قايمة تختار منها.</p>
 <div class="field"><label>اسمك</label><input class="inp" id="en1" value="${esc(U.name)}"></div>
 <div class="field"><label>الاسم المستعار</label><input class="inp" id="en2" value="${esc(U.nickname)}"></div>
 <div class="field"><label>العمر (خاص — لن يُعرض أبدًا)</label><input class="inp" id="en3" type="number" value="${esc(U.age)}"></div>
 <button class="btn btn-y" onclick="A.saveName()">حفظ</button>`);
};
A.saveName=()=>{
 const nName=($('#en1').value||'').trim(),nAge=$('#en3').value;
 if(nName.length<2){toast('الاسم قصير جدًا');return}
 if(!nAge||+nAge<4||+nAge>99){toast('عمر غير صحيح');return}
 U.name=nName;U.nickname=($('#en2').value||'').trim()||U.nickname;U.age=nAge;
 save();closeModal();renderSettings();toast('حُفظ تعديل حسابك');
};
A.editLang=()=>{
 openScreenModal('تغيير اللغة',LANGS.map(l=>`<button class="lang-row" data-l="${l.id}" onclick="A.setLangPick(this)" ${l.id===U.lang?'style="border-color:var(--yell)"':''}><span class="glyph">${esc(l.g)}</span><span>${l.n}${l.id===U.lang?' (حالية)':''}</span></button>`).join(''));
};
A.setLangPick=el=>{
 const id=el.dataset.l;
 if(id===U.lang)return closeModal();
 U.lang=id;buildCurr(id);U.teach=null;
 modal(`<div style="display:flex;justify-content:center">${birdSVG(BIRD_TYPES.find(b=>b.id===U.bird),'idle',70)}</div><h3>من أين تبدأ في ${LANGS.find(l=>l.id===id).n}؟</h3>
 <button class="big-opt" onclick="A.setLangGo('${id}',0)">من الصفر</button>
 <button class="big-opt" onclick="A.obLangSwitch('${id}')">اختبار تحديد المستوى</button>`);
};
A.obLangSwitch=id=>{
 closeModal();
 U.lang=id;buildCurr(id);U.teach=null;
 const B=BANK[id],R=rng('pl'+Date.now());
 const pool=[...B.w.filter(w=>w.tag==='g').slice(0,3),...B.w.filter(w=>['n','c'].includes(w.tag)).slice(0,3),...B.w.filter(w=>['f','fam'].includes(w.tag)).slice(0,2),...B.s.slice(0,2)];
 startLesson({title:'اختبار المستوى',ex:pool.map((it,i)=>i<8?exMCQ(it,1,id,R):exTransSent(it,id,R)),placement:true});
};
A.setLangGo=(id,st)=>{
 U.lang=id;U.startUnit=st;U.teach=null;save();buildCurr(id);
 closeModal();renderSettings();
 toast(`انتقلت إلى ${LANGS.find(l=>l.id===id).n}`);
};
A.tgl=(k,el)=>{U.settings[k]=!U.settings[k];el.classList.toggle('on');save();if(k==='sound'&&U.settings.sound)speak('Hello',U.lang)};
A.tglNotif=async el=>{
 if(!('Notification'in window)){toast('متصفحك لا يدعم الإشعارات');return}
 if(!U.settings.notif){
  const p=await Notification.requestPermission();
  if(p!=='granted'){toast('لم يُسمح بالإشعارات');return}
  U.settings.notif=true;el.classList.add('on');toast('سينبهك كوكتيل يوميًا');
 }else{U.settings.notif=false;el.classList.remove('on')}
 save();
};
A.setGoal=g=>{U.settings.goal=g;save();renderSettings();toast(`هدفك اليومي: ${g} XP`)};
A.setTheme=t=>{U.settings.theme=t;save();applyTheme();renderSettings()};
A.logout=()=>{
 modal(`<h3>تسجيل الخروج؟</h3><p class="muted" style="font-weight:600;margin:8px 0 14px">في المرة القادمة أدخل اسمك وهتلاقي حساباتك كلها تختار منها.</p>
 <button class="btn btn-r" style="width:100%;margin-bottom:8px" onclick="A.logoutGo()">خروج</button>
 <button class="btn btn-o" style="width:100%" onclick="A.closeModal()">بقاء</button>`);
};
A.logoutGo=()=>{DB.session=null;save();U=null;L=null;location.reload()};
A.delAcc=()=>{
 modal(`<h3>حذف الحساب؟</h3><p class="muted" style="font-weight:600;margin:8px 0 14px">سيُحذف كل تقدمك في هذا الحساب ولا يمكن الرجوع.</p>
 <button class="btn btn-r" style="width:100%;margin-bottom:8px" onclick="A.delAcc2()">نعم، احذف كل شيء</button>
 <button class="btn btn-o" style="width:100%" onclick="A.closeModal()">تراجع</button>`);
};
A.delAcc2=()=>{delete DB.users[U.id];DB.session=null;dbSave();U=null;location.reload()};

/* ═══════ 14) الإقلاع ═══════ */
function boot(){
 dbLoad();
 const su=DB.session&&DB.users[DB.session];
 if(su)document.documentElement.dataset.theme=DB.users[DB.session].settings?.theme||'light';
 if(su){
  U=loadUser();
  if(U.lang&&U.nickname)enterApp();
  else{
   OB={step:0,draft:{avatar:Object.assign({},U.avatar),bird:U.bird}};
   show('scr-onboard');drawOB();
  }
 }else renderWelcome();
}
boot();
</script>
</body>
</html>
